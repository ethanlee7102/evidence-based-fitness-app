# CI for the Flame Fitness monorepo.
#
# Scope is deliberately right-sized: lint + fast checks + offline unit tests.
#   - The API job runs `pytest -m "not eval"`. The LLM eval suite (`-m eval`) is
#     EXCLUDED on purpose: it costs money, needs API keys, and is non-deterministic
#     — none of which belong in CI. It is run manually instead.
#   - The API job installs `requirements-ci.txt` (a lean, self-contained set), NOT
#     the full requirements.txt, so it doesn't pull the docling/torch ingestion
#     stack just to lint and run pure-logic unit tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (offline, no eval suite)
        run: pytest -m "not eval"

  web:
    name: Web (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @flame-fitness/web typecheck

      - name: Lint
        run: pnpm --filter @flame-fitness/web lint

      - name: Build
        run: pnpm --filter @flame-fitness/web build
